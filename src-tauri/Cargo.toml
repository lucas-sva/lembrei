[package]
name = "lembrei"
version = "0.1.0"
description = "Plataforma de Aprendizado Ativo e Repetição Espaçada"
authors = ["Lucas Silva <lucas.sva@outlook.com>"]
edition = "2021"

[lib]
name = "lembrei_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lembrei"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rusqlite    = { version = "0.31", features = ["bundled"] }
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4"] }
anyhow      = "1"
log         = "0.4"

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true
